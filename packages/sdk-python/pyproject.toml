[project]
name = "sakura-pay"
dynamic = ["version"]
description = "Server-side client for the Nihonova payment gateway: claim bKash / Nagad / Rocket payments exactly once."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Generated from packages/sdk-spec/spec.json, the version both SDKs share.
path = "src/sakura_pay/_spec.py"

[tool.hatch.build.targets.sdist]
include = ["src/sakura_pay", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/sakura_pay"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The contract suite needs Docker MongoDB and apps/server; run it on its own.
addopts = "--ignore=tests/contract"

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.10"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated from packages/sdk-spec/spec.json; `generate --check` owns its exact text.
extend-exclude = ["src/sakura_pay/_spec.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
